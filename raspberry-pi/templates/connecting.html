<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connecting... - RexiChip</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        padding: 60px 40px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 400px;
        width: 100%;
        text-align: center;
      }

      .spinner {
        width: 60px;
        height: 60px;
        margin: 0 auto 30px;
        border: 6px solid #f3f3f3;
        border-top: 6px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      h1 {
        color: #333;
        font-size: 24px;
        margin-bottom: 16px;
      }

      p {
        color: #666;
        font-size: 16px;
        line-height: 1.6;
      }

      .ssid {
        color: #667eea;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner"></div>
      <h1>Connecting to WiFi...</h1>
      <p>Attempting to connect to <span class="ssid">{{ ssid }}</span></p>
      <p style="margin-top: 20px; font-size: 14px">
        This window will close automatically once connected.
      </p>
    </div>

    <script>
      // Redirect to status page after 10 seconds
      setTimeout(function () {
        window.location.href = "/status";
      }, 10000);
    </script>
  </body>
</html>
